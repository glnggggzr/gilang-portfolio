<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="g-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#ff5b3a" flood-opacity="0.45"/>
    </filter>
  </defs>
  <!-- Rounded square, slightly tapered at bottom per DESIGN.md § 3 -->
  <rect x="6" y="6" width="52" height="52" rx="6" ry="6" fill="#ff5b3a" filter="url(#g-shadow)"/>
  <!-- The 'G' — serif, white, slightly inset from edges -->
  <text
    x="32" y="32"
    text-anchor="middle"
    dominant-baseline="central"
    font-family="'Fraunces', 'Times New Roman', Georgia, serif"
    font-weight="700"
    font-size="42"
    fill="#ffffff"
    font-style="normal">G</text>
</svg>