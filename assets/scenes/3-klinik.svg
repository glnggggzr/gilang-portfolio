    <text x="0" y="140" font-family="-apple-system, system-ui, sans-serif" font-size="22" fill="#241d2b" fill-opacity="0.85">Laravel · appointments &amp; records</text>
    <text x="0" y="220" font-family="-apple-system, system-ui, sans-serif" font-size="14" fill="#241d2b" fill-opacity="0.5">[ placeholder still — replace ]</text>
