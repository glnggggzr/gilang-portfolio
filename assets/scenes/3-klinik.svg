    <rect x="320" y="50" width="60" height="60" fill="#a7e8ca"/>
    <rect x="400" y="50" width="60" height="60" fill="#a7e8ca"/>
    <rect x="320" y="140" width="60" height="60" fill="#a7e8ca"/>
    <rect x="400" y="140" width="60" height="60" fill="#a7e8ca"/>
