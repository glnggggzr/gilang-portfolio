  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#d8f3df"/>
      <stop offset="60%" stop-color="#7dd3a8"/>
      <stop offset="100%" stop-color="#3a9472"/>
